<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>确认您的邮箱地址</title>
  </head>
  <body style="margin: 0; background: #f5f5f0; color: #222222; font-family: Arial, 'Microsoft YaHei', sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding: 40px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width: 560px; background: #ffffff;">
            <tr>
              <td style="padding: 40px 36px;">
                <p style="margin: 0 0 24px; color: #666666; font-size: 13px; letter-spacing: 0.08em;">YlTt's 2025</p>
                <h1 style="margin: 0 0 16px; font-size: 28px; line-height: 1.35; font-weight: 600;">确认您的邮箱地址</h1>
                <p style="margin: 0 0 12px; font-size: 16px; line-height: 1.8;">欢迎加入“YlTt's 2025”！</p>
                <p style="margin: 0 0 28px; color: #555555; font-size: 15px; line-height: 1.8;">请点击下面的按钮确认您的邮箱地址，完成账号注册。</p>
                <p style="margin: 0 0 32px;">
                  <a href="{{ .ConfirmationURL }}" style="display: inline-block; padding: 13px 24px; background: #222222; color: #ffffff; font-size: 15px; text-decoration: none;">确认邮箱地址</a>
                </p>
                <p style="margin: 0; color: #777777; font-size: 13px; line-height: 1.7;">如果按钮无法使用，请将下面的链接复制到浏览器中打开：</p>
                <p style="margin: 8px 0 0; word-break: break-all; color: #777777; font-size: 12px; line-height: 1.7;">{{ .ConfirmationURL }}</p>
                <p style="margin: 32px 0 0; color: #999999; font-size: 12px; line-height: 1.7;">如果您没有注册 YlTt's 2025，请忽略此邮件。</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
